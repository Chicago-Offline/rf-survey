# Shared reference beacons for the Chicagoland survey network (NETWORK.md S7).
#
# Known-constant emitters used to calibrate observers against themselves over
# time and against each other.  They bound HARDWARE VARIANCE -- dead dongle,
# wet feedline, moved or detached antenna, drifting gain -- and NOT
# propagation.  A beacon reading is never evidence about a surveyed channel.
#
# Rules (NETWORK.md S7):
#   - Calibration is BAND-LOCAL.  A good 162 MHz reading says nothing about
#     460 MHz.  Every entry declares a band; an observer is only scored
#     against references its `antenna.bands_mhz` actually covers.  That key
#     is USABLE RX REACH, not resonant bands -- an HT dual-band whip is a
#     2m/70cm antenna but receives ~136-174 and hears 162.550 fine.  Entering
#     resonant bands instead silently disables calibration for that observer.
#   - Baselines are long-term medians over days, never single readings.
#     A spot reading moves several dB with tropo and multipath.
#   - An observer with no covering antenna is `no_reference` for that band.
#     It is NEVER scored as healthy by omission.

schema: rfsurvey.references.v1
region: chicagoland
updated: 2026-09-27

references:
  - id: nws-kwo39
    name: NWS Chicago KWO39
    freq_hz: 162550000
    band: vhf-high
    kind: continuous
    expect: strong
    modulation: nfm
    bandwidth_hz: 16000
    source: https://preview.weather.gov/lot/KWO39
    notes: >
      NOAA Weather Radio, 300 W from Willis Tower, continuous voice loop at
      constant ERP, ~40 mi nominal range.  Primary VHF-high reference: always
      on, never moves, never changes power.  This is the one to use for the
      co-sited observer comparison that sets the drift threshold N.

  - id: ord-datis
    name: O'Hare D-ATIS (KORD)
    freq_hz: 135400000
    band: airband
    kind: continuous
    expect: strong
    modulation: am
    bandwidth_hz: 8000
    source: https://ourairports.com/airports/KORD/frequencies.html
    notes: >
      Continuous AM information loop -- effectively a constant carrier with
      voice modulation.  Secondary anchor below the 2 m band.  AM: measure
      channel power, do not expect FM deviation.

  - id: fm-wbez-915
    name: WBEZ 91.5
    freq_hz: 91500000
    band: fm-broadcast
    kind: broadcast
    expect: very_strong
    modulation: wfm
    bandwidth_hz: 200000
    notes: >
      Gross sanity check only.  Broadcast FM is a blowtorch: it confirms the
      dongle and feedline are alive, but it will read strong through a badly
      mismatched antenna and can overload a front end at high gain.  Never
      treat a healthy FM reading as evidence that VHF-high or UHF is working.

  - id: fm-wxrt-931
    name: WXRT 93.1
    freq_hz: 93100000
    band: fm-broadcast
    kind: broadcast
    expect: very_strong
    modulation: wfm
    bandwidth_hz: 200000
    notes: Second FM anchor; same caveats as WBEZ.

  - id: fm-wnur-893
    name: WNUR-FM 89.3 (Northwestern, Evanston)
    freq_hz: 89300000
    band: fm-broadcast
    kind: broadcast
    expect: very_strong
    modulation: wfm
    bandwidth_hz: 200000
    source: https://transition.fcc.gov/fcc-bin/fmq?call=WNUR
    notes: >
      Closest licensed transmitter to the Evanston observer: FCC facility
      49779 at 42.053361/-87.675889, roughly 1.3 km from the frontline site
      versus ~21 km to the Willis Tower cluster.
      7.2 kW ERP horizontal AND vertical.  The vertical component is the
      point: a whip is vertically polarised and most FM broadcast is not,
      so this couples into an HT antenna far better than WBEZ does.
      Sits in the reserved 88-92 educational sub-band, so its shoulders are
      less crowded than 91.5's, giving a cleaner noise median.
      Diagnostic: if a 7.2 kW vertical signal 1.3 km away does NOT read well
      above the distant FM anchors, then the FM readings are stray coupling
      into the front end rather than genuine antenna capture.

  - id: nws-kzz81
    name: NWS Lockport KZZ-81
    freq_hz: 162425000
    band: vhf-high
    kind: continuous
    expect: strong
    modulation: nfm
    bandwidth_hz: 16000
    source: https://www.weather.gov/lot/nwr
    notes: >
      NOAA Weather Radio, 1000 W from Lockport -- the highest-power NWR
      transmitter listing Cook County in its coverage area, 3.3x KWO39's
      ERP.  Cross-check against nws-kwo39: if Lockport is heard and Chicago
      is not, the fault is that transmitter or its path, not the receiver.

  - id: nws-kxi41
    name: NWS Crystal Lake KXI-41
    freq_hz: 162500000
    band: vhf-high
    kind: continuous
    expect: strong
    modulation: nfm
    bandwidth_hz: 16000
    source: https://www.weather.gov/lot/nwr
    notes: >
      NOAA Weather Radio, 300 W from Crystal Lake, lists Cook in its
      coverage area.  Third VHF-high anchor.  Three independent NWR
      transmitters mean a deaf receiver cannot be mistaken for a quiet band.

  - id: atsc-wgn-rf19
    name: WGN-TV RF 19 ATSC 1.0 pilot
    freq_hz: 500309440
    band: uhf
    kind: continuous
    expect: very_strong
    modulation: cw
    bandwidth_hz: 10000
    source: https://transition.fcc.gov/fcc-bin/tvq?call=WGN
    notes: >
      8VSB pilot tone, 0.30944 MHz above the RF 19 lower edge (500 MHz).
      FCC licence record: facility 72115, 645 kW ERP, Willis Tower, and
      "ATSC 3.0 (Nextgen TV)? No" -- confirmed 1.0, so the pilot exists.
      A pure CW tone sitting in an otherwise flat 8VSB data floor: keep
      bandwidth_hz narrow so the shoulders stay inside the data block and
      the pilot reads well above it.
      Do NOT copy this pattern to WBBM RF 12 -- that station is ATSC 3.0
      (OFDM, facility 9617) and has no pilot carrier at all.  A reference
      at 204.309 would measure nothing and poison its own baseline.

# ---------------------------------------------------------------------------
# UHF (ATSC pilot tones) -- NOT YET POPULATED.  See NETWORK.md S7.
#
# The UHF land-mobile band (450-470 MHz) is the one we most need calibrated,
# and it currently has NO usable reference:
#
#   1. No antenna.  Both bench observers run HT dual-band whips that top out
#      around 450 MHz.  Until something reaches past 450, UHF observers are
#      correctly reported as `no_reference`, not healthy.
#   2. No verified entries.  ATSC 1.0 puts a pilot 0.309441 MHz above the
#      lower edge of its RF channel; for channels 14-36 the lower edge is
#      470 + (N - 14) * 6 MHz.  Chicago's post-repack channel assignments
#      have NOT been verified here, and guessed frequencies would poison
#      every baseline computed against them.
#
# Populate only from a verified source (FCC facility record or a confirmed
# local scan), one entry per RF channel, with `source:` filled in.
# ---------------------------------------------------------------------------
uhf_references: []
