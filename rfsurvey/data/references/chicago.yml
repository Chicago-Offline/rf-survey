  - id: fm-wrme-877
    name: WRME-LD 87.75 "MeTV FM" analog aural carrier
    freq_hz: 87750000
    band: vhf-low
    kind: broadcast
    expect: strong
    modulation: nfm
    bandwidth_hz: 50000
    source: https://en.wikipedia.org/wiki/WRME-LD
    notes: >
      Channel 6 "FrankenFM": an LPTV whose analog aural carrier at 87.75
      sits just below the FM dial.  FCC granted PERMANENT analog-audio
      authorization in July 2023; 3 kW from Willis Tower.  The only
      continuous emitter we have below 88 MHz.  NTSC-style aural carrier
      is FM, so nfm with wide-ish shoulders.  The first beacon pass after
      adding this entry is the on-air confirmation; a not_heard here
      never enters a baseline (drift uses status=ok rows only).

# ---------------------------------------------------------------------------
# Band coverage verdicts (2026-10-01):
#
# UHF 470-608 (ATSC pilots): POPULATED above -- RF 19/22/25/34 pilots at
#   500.309/518.309/536.309/590.309 MHz, each verified against the FCC tvq
#   record ("ATSC 3.0 (Nextgen TV)? No" => the 1.0 pilot exists).  WBBM
#   RF 12 stays excluded: ATSC 3.0, no pilot.  Expect these weak on HT
#   whips; they read no_reference/observed, which is correct and still
#   tracks the front end over time.
#
# 700 MHz: NO TV THERE.  Post-repack full-power TV stops at RF 36
#   (608 MHz); the old 700 MHz TV channels are now LTE downlinks
#   (B12/B13/B14-FirstNet, 729-768 MHz).  LTE is a poor fit for THIS
#   harness: the beacon measurement wants a narrow carrier in quiet
#   shoulders, but OFDM is a flat ~10 MHz block whose neighbours are more
#   LTE blocks -- there is no quiet shoulder inside measure()'s window, so
#   SNR would read a few dB regardless of hardware health.  If >608 MHz
#   calibration ever matters, it needs a channel-power mode with an
#   explicit off-band noise window, not a pilot-style entry here.
#
# VHF-low / "lowband": WRME-LD 87.75 (above) is the only continuous
#   carrier below the FM dial.  True 30-50 MHz lowband has NO constant
#   Chicagoland emitter (lowband TV is gone, no lowband paging, IL public
#   safety left the band decades ago); lowband sweeps therefore run
#   uncalibrated and must never be scored as healthy.
#
# HF: NO off-air reference is usable, for two independent reasons.
#   1. Hardware: R820T2 tunes down to ~24 MHz, E4000 to ~52 MHz, and the
#      harness does not drive direct-sampling mode, so WWV/CHU
#      (2.5-20 MHz) sit below every observer's floor.
#   2. Physics: even with capable hardware, WWV/CHU levels are
#      ionosphere-dominated (tens of dB day/night swing).  That measures
#      PROPAGATION, which S7 explicitly excludes -- a beacon exists to
#      bound hardware variance.  HF health needs a local injected cal
#      source, not an off-air beacon.
# ---------------------------------------------------------------------------
