<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>rf-survey logo: an antenna above a spectrum waterfall</title>
  <rect x="0" y="0" width="128" height="128" rx="20" fill="#171e26" stroke="#2a3743" stroke-width="2"/>
  <!-- antenna mast -->
  <line x1="64" y1="22" x2="64" y2="62" stroke="#d6dee6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="20" r="5" fill="#4fb3ff"/>
  <!-- signal arcs -->
  <path d="M48 30 a22 22 0 0 1 0-20" fill="none" stroke="#4fb3ff" stroke-width="4" stroke-linecap="round" transform="translate(3 15)"/>
  <path d="M80 10 a22 22 0 0 1 0 20" fill="none" stroke="#4fb3ff" stroke-width="4" stroke-linecap="round" transform="translate(-3 15)"/>
  <!-- waterfall / spectrum bars -->
  <g stroke-linecap="round">
    <line x1="24" y1="98" x2="24" y2="84" stroke="#1a4a6e" stroke-width="7"/>
    <line x1="37" y1="98" x2="37" y2="76" stroke="#4fb3ff" stroke-width="7"/>
    <line x1="50" y1="98" x2="50" y2="88" stroke="#1a4a6e" stroke-width="7"/>
    <line x1="63" y1="98" x2="63" y2="70" stroke="#4fd18b" stroke-width="7"/>
    <line x1="76" y1="98" x2="76" y2="86" stroke="#1a4a6e" stroke-width="7"/>
    <line x1="89" y1="98" x2="89" y2="78" stroke="#f0b64a" stroke-width="7"/>
    <line x1="102" y1="98" x2="102" y2="90" stroke="#1a4a6e" stroke-width="7"/>
  </g>
  <line x1="18" y1="106" x2="110" y2="106" stroke="#2a3743" stroke-width="3" stroke-linecap="round"/>
</svg>
