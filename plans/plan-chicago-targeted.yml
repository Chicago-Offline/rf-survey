# Chicago targeted-check plan — MONITOR ONLY, no discovery sweep.
#
# The counterpart to plan-chicago-monitor.yml.  That plan does both
# missions on one dongle and splits airtime with duty_pct.  This one does
# only the second mission:
#
#   "go look at these specific known channels on a schedule, tell me the
#    signal, and tell me whether anything actually decoded."
#
# Use it when you want the beacon-check *shape* of answer (a row per
# channel, every time) applied to the real catalog instead of the
# reference beacons -- or when a second dongle is already covering
# discovery on the same spectrum and a sweep here would be wasted
# airtime.
#
# Why this is not just "a sweep with a narrow band": a sweep only dwells
# where it sees energy above the noise floor, and a continuous emitter
# self-baselines into its own noise estimate.  A quiet repeater between
# overs, and a busy one that never drops carrier, are BOTH invisible to
# the gate.  Targeted checks tune and listen regardless, so a silent
# channel still writes a "checked, nothing there" row -- which is what
# makes "last heard" answerable instead of "never looked".
#
# What it CAN report per check: SNR, gate open/closed, and for analog FM
# CTCSS tone, DCS presence, bandwidth, mode; for DMR color code and
# timeslots.
#
# 🔴 What it CANNOT report:
#   - AM.  Decoders are nfm and dmr only.  An airband/AM target gets
#     energy and SNR, never a decode verdict.
#   - P25 / trunked.  Same story: carrier presence only.  Half a
#     public-safety target list in this region is P25, so expect those
#     rows to show a signal with no parameters.
#   - DCS *code*.  Presence only; the 23,12 Golay decode is not
#     implemented.
#
# Run it like any other plan:
#   survey --config ~/.config/rf-survey/config.yml \
#          run --serial SONDE plans/plan-chicago-targeted.yml
# Read it back with:
#   survey --config ~/.config/rf-survey/config.yml \
#          monitor-status --plan plans/plan-chicago-targeted.yml
name: chicago-targeted

# No "bands:" key at all -- that is what makes this monitor-only.
# config.load_plan defaults bands to [] and requires that monitor
# resolved at least one target, so a typo here fails at startup rather
# than claiming a dongle and idling forever.

monitor:
  interval_s: 600           # revisit each target at least every 10 min
  duration_s: 20            # decode dwell once the energy gate opens
  squelch_db: 6.0
  decoder: nfm

  # With no sweep, duty_pct has no referent, so airtime is pinned
  # absolutely.  Omit budget_s and it defaults to one unhurried pass over
  # every target (per-target dwell + ~5 s gate overhead, floor 60 s).
  # Pinned here because this list is long and priority ordering should
  # get several passes' worth of chances before the list wraps.
  budget_s: 420

  # Same generated target files as the combined plan -- ssrf-lite stays
  # the source of truth, these are regenerated by tools/gen_targets.py
  # rather than hand-maintained.  Paths are relative to this plan file.
  targets_file:
    - targets-nsea-gmrs.yml       # 4 NSEA GMRS repeaters, priority 1
    - targets-ham-local.yml       # 19 local ham repeaters, priority 2
    - targets-chioff-overlay.yml  # ChiO REPEATER 462.550, priority 1

  # See plan-chicago-monitor.yml for the open 462.550 DCS-vs-CTCSS
  # conflict these targets are meant to settle; it is not restated here
  # so the two plans cannot drift apart on it.
