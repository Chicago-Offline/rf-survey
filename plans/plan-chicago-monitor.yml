# Chicago monitoring + discovery seed plan (milestone 1).
#
# Two missions in one plan, deliberately:
#   monitor:  go and check channels we already believe in, on a schedule,
#             whether or not the sweep sees energy there.  This is what
#             makes "last heard" and "parameters verified" answerable.
#   bands:    keep exploring the same spectrum for things we do not know
#             about yet.
#
# Monitoring takes duty_pct of each pass's airtime and hands the radio
# back; it never starves discovery.  A silent target costs ~5 s (energy
# gate only) and still writes a "checked, nothing there" row, which is the
# whole point -- without that row a quiet repeater is indistinguishable
# from one nobody ever looked at.
name: chicago-monitor-seed

sweep:
  integration_s: 10
  passes: 0                 # run forever
  channel_raster_hz: 6250   # UHF narrowband grid

dwell:
  snr_db: 12.0
  min_hits: 3
  duration_s: 60
  decoder: nfm
  squelch_db: 6.0

monitor:
  interval_s: 900           # revisit each target at least every 15 min
  duration_s: 20            # decode dwell once the gate opens
  squelch_db: 6.0
  decoder: nfm
  duty_pct: 30              # share of each pass spent on known channels

  # Generated from ssrf-lite by tools/gen_targets.py -- the catalog is the
  # source of truth for what we expect, so these are regenerated rather
  # than hand-maintained.  Paths are relative to this plan file.
  targets_file:
    - targets-nsea-gmrs.yml     # 4 NSEA GMRS repeaters, priority 1
    - targets-ham-local.yml     # 19 local ham repeaters, priority 2
    - targets-chioff-overlay.yml  # ChiO REPEATER 462.550, priority 1

  # No hand-pinned targets right now, and that is the desired state: a
  # hand-pinned target is a belief with no catalog record behind it, so
  # each one is really a gap in ssrf-lite.  Add them here only while that
  # gap is open, and delete them once the record exists.
  #
  # 🔴 OPEN CONFLICT on 462.550, deliberately NOT resolved here.
  # The overlays and ssrf-lite core disagree about this frequency:
  #
  #   asg_chio_repeater   "ChiO REPEATER"  chioff-ssrf-shared
  #                       462.550/467.550, DCS 023 polarity N, 20K0F3E
  #   asg_priv_fam_repeater "FAM REPEATER" muehlstein-ssrf-private
  #                       462.550/467.550, DCS 023, 11K2F3E bw 25
  #   asgn_gmrs_chicago_550 "Chicago 550"  ssrf-lite core
  #                       462.5500/467.5500, CTCSS 156.7, no callsign,
  #                       sourced from a RadioReference listing
  #
  # Two overlays independently say DCS 023, so the core record is the
  # outlier -- but it is NOT established whether it describes this same
  # machine (stale/wrong tone) or a genuinely different system sharing
  # the channel.  Monitoring is what settles it: a DCS carrier here
  # contradicts the 156.7 claim regardless of which code it turns out to
  # be.  We track the overlay record and let the evidence decide.
  #
  # NOTE: detect_dcs reports DCS *presence* only -- the 23,12 Golay decode
  # is not implemented -- so dcs_code and dcs_polarity will read
  # "unverified" with "DCS present, code decode not implemented" rather
  # than confirming 023/N. Presence alone still contradicts CTCSS 156.7,
  # which is the immediate value.

# Discovery: keep sweeping the GMRS/business UHF region the targets live
# in, so unknown activity next door to a known channel still gets found.
bands:
  - start_mhz: 462.5
    stop_mhz: 467.8
    step_khz: 6.25
    channel_raster_hz: 6250
  - start_mhz: 144.0
    stop_mhz: 148.0
    step_khz: 2.5
    channel_raster_hz: 2500   # 2m sits on a 2.5 kHz grid, not 6.25
  - start_mhz: 442.0
    stop_mhz: 448.0
    step_khz: 2.5
    channel_raster_hz: 2500
